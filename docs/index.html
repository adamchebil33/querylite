<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Querylite</title>
    <meta name="description" content="Drop in a CSV and query millions of rows instantly, right in your browser. Nothing is uploaded." />
    <!--
      Share link for LinkedIn and other sites. Link-preview crawlers cannot read pages
      on workers.dev, so this GitHub Pages copy carries the preview and sends people on
      to the app. Crawlers do not run scripts, so they stay here and read the tags.
      Every URL here points at github.io on purpose: pointing og:url back at workers.dev
      would send the crawler to the page it cannot read.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Querylite" />
    <meta property="og:title" content="Querylite: query millions of rows without uploading one" />
    <meta property="og:description" content="Drop in a CSV and query millions of rows instantly, right in your browser. Nothing is uploaded." />
    <meta property="og:url" content="https://adamchebil33.github.io/querylite/" />
    <meta property="og:image" content="https://adamchebil33.github.io/querylite/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:alt" content="Querylite: query millions of rows without uploading one. Nothing is uploaded." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      location.replace('https://querylite.adamchebil.workers.dev/');
    </script>
    <style>
      :root { color-scheme: light dark; --paper: #f6f4ee; --ink: #1b1a17; --accent: #1c6b4a; }
      @media (prefers-color-scheme: dark) { :root { --paper: #121210; --ink: #ecebe6; --accent: #5fb48c; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 17px/1.5 Georgia, serif; padding: 0 16px; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <p>Opening Querylite… <a href="https://querylite.adamchebil.workers.dev/">Continue to the app</a></p>
  </body>
</html>
